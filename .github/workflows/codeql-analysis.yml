name: "CodeQL"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.gif"
      - "**/*.svg"
      - ".github/**"
      - "!.github/workflows/codeql-analysis.yml"
      - "!.github/codeql/*"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - "manifest.json"
      - "README.md"
      - "versions.json"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - "**/*.gif"
      - "**/*.svg"
      - ".github/**"
      - "!.github/workflows/codeql-analysis.yml"
      - "!.github/codeql/*"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - "manifest.json"
      - "README.md"
      - "versions.json"
  schedule:
    - cron: "00 12 * * 5"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
