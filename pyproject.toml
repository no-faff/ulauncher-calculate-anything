[tool.pytest.ini_options]
# ResourceWarning is emitted by the garbage collector at non-deterministic
# times and attached to arbitrary tests, so it is not a reliable signal.
# Real leaks are closed in the code; everything else stays an error.
filterwarnings = ["error", "ignore::ResourceWarning"]
# The babel vs plain unit suite is selected per-environment by
# test/query/handlers/conftest.py, depending on whether babel is importable.
addopts = """--ignore=test/benchmark \
    --allow-hosts=127.0.0.1,127.0.1.1,::1"""

[tool.coverage.run]
command_line = "-m pytest"
branch = false
parallel = true
include = ["./*"]
omit = [
    ".tox/*",
    "demo/*",
    "test/*",
    "main.py",
    "__init__.py",
    "calculate_anything/appdirs.py"
]

[tool.coverage.report]
ignore_errors = false
show_missing = true
include = ["./*"]
omit = [
    ".tox/*",
    "demo/*",
    "test/*",
    "main.py",
    "__init__.py",
    "calculate_anything/appdirs.py"
]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "# pragma: no cover",
    # Ignore pass
    "^\\s*pass\\s*$",
    # Ignore Ellipsis (...)
    "^\\s*\\.\\.\\.\\s*$",
    "^\\s*Ellipsis\\s*$"
]

[tool.coverage.html]
directory = "cover/html/"

[tool.coverage.xml]
output = "cover/xml/coverage.xml"

[tool.flake8]
max-line-length = 80
ignore = [
    "E203",
    "W503"
]

[tool.black]
line-length = 80
skip-string-normalization = true

[tool.tox]
legacy_tox_ini = """
[tox]
skipsdist = true
minversion = 3.24.1
recreate = false
envlist = clean,linting,codestyle,py{310,311,312,313,314}-{babel,nobabel},coverage,benchmark

[testenv:clean]
deps = -r{toxinidir}/requirements/test-requirements.txt
commands = coverage erase

[testenv:linting]
deps = -r{toxinidir}/requirements/linting-requirements.txt
commands =
    pflake8 {toxinidir} --count --show-source --statistics
    pflake8 {toxinidir} --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

[testenv:codestyle]
deps = -r{toxinidir}/requirements/linting-requirements.txt
commands = black --check {toxinidir}/

[testenv:coverage]
commands =
    coverage combine
    coverage report
    coverage html
    coverage xml

# babel is a core dependency, so the default (babel) factor tests the
# babel-aware path. The nobabel factor uninstalls it to exercise the
# import-failure fallback. The conftest picks the matching unit suite.
[testenv]
platform = linux2?|darwin|win32
deps =
    -r{toxinidir}/requirements/requirements.txt
    -r{toxinidir}/requirements/test-requirements.txt
commands_pre =
    nobabel: - pip uninstall -y Babel
commands = coverage run

[testenv:benchmark]
basepython = python3.9
deps =
    -r{toxinidir}/requirements/requirements.txt
    -r{toxinidir}/requirements/test-requirements.txt
commands = pytest {toxinidir}/test/benchmark/ --benchmark-json benchmark-python3.9.json
"""
